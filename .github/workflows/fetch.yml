name: Fetch Iceland prices

on:
  schedule:
    # Weekdays 15:50 UTC, 20 min after the Nasdaq Iceland close (15:30 UTC). GitHub may start it a little late.
    - cron: "50 15 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to request for symbols without a CSV yet"
        default: "730"

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./cmd/fetch -days "${{ inputs.days || '730' }}"
      - name: Commit data
        run: |
          git config user.name "iceland-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: $(date -u +%F)"
            git push
          fi
